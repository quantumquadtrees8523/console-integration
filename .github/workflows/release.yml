name: release

# A release: tested, checked against the manifest's version, and published as a GitHub release, which is
# what HACS installs. A merge to main that raises the version releases it by itself (a push to main whose
# version is already out does nothing). A pushed tag vX.Y.Z, or Run workflow on main, does the same.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Which release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else
            [ "$GITHUB_REF_NAME" = main ] || { echo "Run it on main."; exit 1; }
            tag="v$(python3 -c "import json;print(json.load(open('custom_components/console/manifest.json'))['version'])")"
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released: nothing to do."; tag=""; fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: The tag matches the manifest and const.py
        if: env.TAG != ''
        run: |
          v="${TAG#v}"
          grep -q "\"version\": \"$v\"" custom_components/console/manifest.json
          grep -q "^VERSION = \"$v\"$" custom_components/console/const.py
      - name: Write the GitHub release
        if: env.TAG != ''
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
