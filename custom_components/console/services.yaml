rebuild_dashboard:
  name: Rebuild the Home dashboard
  description: Build Console's Home dashboard again from the house as it is now. Replaces hand edits to that dashboard.
  fields:
    force:
      name: Replace hand edits
      description: Rebuild even if the dashboard was edited by hand since Console last wrote it.
      default: true
      selector:
        boolean:
suggest_routines:
  name: Suggest routines
  description: Ask Console's agent to look for routines now, guided by Sunrise's routines skill. Does nothing while suggested routines are turned off. Each run uses some of this month's credits.
  fields:
    heard:
      name: Only what the house heard
      description: On, the short run (a door opened, then someone switched a light). Off, the full look at how the house is used.
      default: true
      selector:
        boolean:
